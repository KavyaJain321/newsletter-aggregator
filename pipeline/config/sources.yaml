  - id: brew_markets
    brand: brew_markets
    editions: [finance]
    match: [{ address: brewmarkets@morningbrew.com }]
    cadence: weekdays
    expected_send_et: "16:15"

  - id: money_stuff
    brand: money_stuff
    editions: [finance]
    match: [{ address: noreply@news.bloomberg.com, name_regex: "^Matt Levine$" }]
    cadence: weekdays
    expected_send_et: "14:00"

  - id: businessweek_daily
    brand: businessweek_daily
    editions: [finance]
    match: [{ address: noreply@news.bloomberg.com, name_regex: "^Bloomberg Businessweek$" }]
    cadence: weekdays
    expected_send_et: "13:15"

  - id: semafor_business
    brand: semafor
    editions: [finance, tech]
    match: [{ address: business@semafor.com }]
    cadence: weekdays
    expected_send_et: "12:00"

  - id: morning_brew
    brand: morning_brew
    editions: [finance]
    match: [{ address: crew@morningbrew.com }]
    cadence: daily
    expected_send_et: "06:00"
    notes: "Paused us once for inactivity (2026-09-02); re-confirmed 2026-10-04."

  - id: the_diff
    brand: the_diff
    editions: [finance]
    match: [{ address: the-diff@ghost.io }]
    cadence: weekly
    paywall_mode: partial
    notes: "Free tier: Monday essay + Saturday Longreads."

  - id: net_interest
    brand: net_interest
    editions: [finance]
    match: [{ address: netinterest@substack.com }]
    cadence: weekly
    paywall_mode: preview
    notes: "Fridays. Free email is a ~450-word preview."

  - id: doomberg
    brand: doomberg
    editions: [finance]
    match: [{ address: doomberg@substack.com }]
