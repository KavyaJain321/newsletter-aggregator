    paywall_mode: preview

  - id: axios_pro_rata
    brand: axios_pro_rata
    editions: [finance]
    match: [{ address: pro-rata@axios.com }]
    cadence: weekdays
    verified: false
    notes: "Confirmed 2026-10-04; sender address not yet seen — verify on first issue."
